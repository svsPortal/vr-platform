name: VR Beta Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check Python syntax
        run: python -m py_compile scripts/update_youtube.py
      - name: Check required files
        run: test -f index.html && test -f styles.css && test -f creator.css && test -f data/youtube.json && test -f data/discovery-candidates.json
