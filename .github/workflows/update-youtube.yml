name: Update YouTube data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch YouTube Data API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube.py
      - name: Commit data
        run: |
          git config user.name "vr-youtube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/youtube.json data/discovery-candidates.json
          git diff --cached --quiet || git commit -m "Update YouTube creator data"
          git push
