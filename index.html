<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>VR - 推しと出会って、応援しよう</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css?v=20260921-25">
<link rel="stylesheet" href="./creator.css?v=20260921-25">
</head>
<body>
<div id="app"><div style="padding:24px;font-family:sans-serif;color:#423e58">VRを読み込み中...</div></div>
<script>
window.addEventListener("error",function(e){
 var a=document.getElementById("app");
 if(a && !a.querySelector(".shell")) a.innerHTML='<div style="padding:24px;font-family:sans-serif"><b>VRの読み込みに失敗しました</b><p style="color:#777">'+String(e.message||"不明なエラー")+'</p><button onclick="location.reload()">再読み込み</button></div>';
});
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}
if("caches" in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}
</script>
<script src="./app.js?v=20260921-25"></script>
</body>
</html>
